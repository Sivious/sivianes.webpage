<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Glitch Particles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* Interfaz futurista (FUI) superpuesta */
        .interface {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Permite interactuar con el canvas debajo */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
            z-index: 10;
        }
        .header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            letter-spacing: 2px;
            opacity: 0.7;
        }
        .footer {
            text-align: center;
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; }
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="interface">
        <div class="header">
            <div>SYS_STATUS: ACTIVE</div>
            <div>ERR_RATE: 0.042%</div>
        </div>
        <div class="footer">
            [ systems_ ]
        </div>
    </div>

    <canvas id="glitchCanvas"></canvas>

    <script>
        const canvas = document.getElementById('glitchCanvas');
        const ctx = canvas.getContext('2d');

        // Ajustar tamaño de pantalla
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Control de ratón
        const mouse = {
            x: null,
            y: null,
            radius: 120
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Configuración de las partículas
        const particles = [];
        const numberOfParticles = 1200;

        class Particle {
            constructor() {
                // Posición base (formando un óvalo/rostro abstracto en el centro)
                const angle = Math.random() * Math.PI * 2;
                const radiusX = (canvas.width * 0.15) * Math.sqrt(Math.random());
                const radiusY = (canvas.height * 0.25) * Math.sqrt(Math.random());
                
                this.baseX = canvas.width / 2 + Math.cos(angle) * radiusX;
                this.baseY = canvas.height * 0.45 + Math.sin(angle) * radiusY;
                
                this.x = this.baseX;
                this.y = this.baseY;
                this.size = Math.random() * 1.5 + 0.5;
                this.density = (Math.random() * 30) + 1;
                this.glitchTimer = Math.random() * 100;
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                // 1. Reacción al ratón (empuje)
                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.hypot(dx, dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    
                    if (distance < mouse.radius) {
                        this.x -= forceDirectionX * force * this.density;
                        this.y -= forceDirectionY * force * this.density;
                    } else {
                        // Volver a la posición original lentamente
                        if (this.x !== this.baseX) {
                            let dx = this.x - this.baseX;
                            this.x -= dx / 15;
                        }
                        if (this.y !== this.baseY) {
                            let dy = this.y - this.baseY;
                            this.y -= dy / 15;
                        }
                    }
                } else {
                    // Volver a la posición original
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 20;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 20;
                    }
                }

                // 2. Efecto Glitch aleatorio (desplazamientos bruscos horizontales temporales)
                this.glitchTimer--;
                if (this.glitchTimer <= 0) {
                    if (Math.random() > 0.95) {
                        // Distorsión horizontal agresiva
                        this.x += (Math.random() - 0.5) * 80;
                    }
                    this.glitchTimer = Math.random() * 100;
                }
            }
        }

        // Crear partículas
        function init() {
            particles.length = 0;
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }
        init();

        // Líneas de glitch y cuadrícula en el fondo
        function drawBackgroundGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            
            // Cuadrícula vertical y horizontal
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Franjas de interferencia horizontales aleatorias
            if (Math.random() > 0.92) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';
                ctx.fillRect(0, Math.random() * canvas.height, canvas.width, Math.random() * 10 + 2);
            }
        }

        // Bucle de animación
        function animate() {
            // Estela sutil para simular desenfoque de movimiento (motion blur)
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawBackgroundGrid();

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }
        animate();

        // Reajustar partículas si cambia el tamaño de ventana
        window.addEventListener('resize', () => {
            init();
        });
    </script>
</body>
</html>
